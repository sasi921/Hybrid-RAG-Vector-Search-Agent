[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-vector-search-agent"
version = "0.1.0"
description = "Local SQLite FTS5 + vector similarity RAG agent with source citations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["hybrid_rag*"]
